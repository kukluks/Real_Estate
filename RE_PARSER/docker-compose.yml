services:
  re_parser:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: re_parser
    restart: "no"
    stdin_open: true
    tty: true
    env_file:
      - .env.dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./.session:/app/.session
    command: ["python", "src/main.py"]
