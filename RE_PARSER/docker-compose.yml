version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: re_parser_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: re_parser
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d re_parser"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: re_parser_api
    restart: unless-stopped
    env_file:
      - .env.dev
    ports:
      - "8001:8001"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn src.main:app --host 0.0.0.0 --port 8001 --log-level debug
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default    # чтобы по-прежнему видеть db по имени "db"
      - re_shared   # чтобы достучаться до re_telegram (и позже до re_api2)

networks:
  re_shared:
    external: true

volumes:
  postgres_data:
