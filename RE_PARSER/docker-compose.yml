services:
  db:
    image: postgres:16-alpine
    container_name: re_parser_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: re_parser
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d re_parser"]
      interval: 5s
      timeout: 5s
      retries: 10

  re_parser:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: re_parser
    restart: "no"
    stdin_open: true
    tty: true
    env_file:
      - .env.dev
    environment:
      MODE: dev
      HEADLESS: "true"
      BROWSER: chromium
      TIMEOUT_MS: "30000"
      MAX_ITEMS: "20"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: re_parser
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      INSTAGRAM_SCROLL_COUNT: "3"
      INSTAGRAM_LOGIN_REQUIRED: "false"
      INSTAGRAM_USERNAME: ""
      INSTAGRAM_PASSWORD: ""
      INSTAGRAM_SESSION_STATE_PATH: /app/.session/instagram.json
      INSTAGRAM_SAVE_SESSION: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./.session:/app/.session
    command: ["python", "src/main.py"]

volumes:
  postgres_data:
