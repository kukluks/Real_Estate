[project]
name = "service-monitoring-real-estate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kukluks", email = "rodiongrayholm@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
]

[tool.hatch.build.targets.wheel]
packages = ["service_monitoring_real_estate"]

[project.scripts]
service-monitoring-real-estate = "service_monitoring_real_estate:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
